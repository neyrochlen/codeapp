<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { font-family: sans-serif; text-align: center; padding: 40px 16px;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }
  .code { display: flex; justify-content: center; gap: 12px; margin: 30px 0; }
  .code input { width: 56px; height: 64px; font-size: 28px; text-align: center;
                border: 2px solid #999; border-radius: 12px; }
  button { padding: 14px 32px; font-size: 18px; border: none; border-radius: 12px;
           background: #2481cc; color: #fff; }
  button:disabled { opacity: 0.4; }
</style>
</head>
<body>
  <h2>Введите 4-значный код</h2>
  <div class="code">
    <input type="tel" maxlength="1" inputmode="numeric">
    <input type="tel" maxlength="1" inputmode="numeric">
    <input type="tel" maxlength="1" inputmode="numeric">
    <input type="tel" maxlength="1" inputmode="numeric">
  </div>
  <button id="send" disabled>Подтвердить</button>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const inputs = document.querySelectorAll(".code input");
  const btn = document.getElementById("send");

  function getCode() { return [...inputs].map(i => i.value).join(""); }

  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      btn.disabled = getCode().length !== 4;
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
  });

  btn.addEventListener("click", () => tg.sendData(getCode()));
</script>
</body>
</html>
